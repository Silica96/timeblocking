version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: timeblocking-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timeblocking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeblocking_password}
      POSTGRES_DB: ${POSTGRES_DB:-timeblocking}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - timeblocking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timeblocking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timeblocking-app-prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timeblocking}:${POSTGRES_PASSWORD:-timeblocking_password}@db:5432/${POSTGRES_DB:-timeblocking}?schema=public
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - timeblocking-network
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  postgres_data:
    driver: local

networks:
  timeblocking-network:
    driver: bridge
