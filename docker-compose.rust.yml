version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: timeblocking-rust-db
    environment:
      POSTGRES_DB: timeblocking
      POSTGRES_USER: timeblocking
      POSTGRES_PASSWORD: timeblocking
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_rust:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeblocking"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: timeblocking-rust-app
    environment:
      DATABASE_URL: postgresql://timeblocking:timeblocking@db:5432/timeblocking
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      LEPTOS_RELOAD_PORT: 3001
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_rust:
